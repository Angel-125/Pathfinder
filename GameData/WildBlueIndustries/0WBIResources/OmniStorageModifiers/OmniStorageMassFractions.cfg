// Stock Size 1 tanks' dry mass are 6.9%, while Size 1p5+ are 11.1%
// BUT when you change the resources in, say, a Rockomax Jumbo 64 to Hydrolox, the mass fraction jumps to ~29%, which is really bad! That's because Hydrolox is a lot lighter than LFO, which puts stock tanks at a disadvantage.
// These mass fraction variants tell WBIOmniConverter how to adjust the tank's dry mass based on the volume of the tank. That way, that Jumbo 64's dry mass drops from 4 t to ~1.21 t when it stores Hydrolox- but the dry mass cost of the tank goes up.
// If reconfigured in the field, and the dry mass of the tank increases due to the updated resources that the tank will store, then it'll cost more in resources to refit the tank.

OMNI_MASS_FRACTION
{
	name = Size1
	maxVolume = 4000 	// Tanks over this size limit cannot use this mass fraction set

	VARIANT
	{
		name = Standard

		// Stock Size 1 tanks use a 6.9% mass fraction.
		massFraction = 0.069
		costMultiplier = 1
	}

	VARIANT
	{
		name = Lightweight
		massFraction = 0.056
		costMultiplier = 1.2
	}

	VARIANT
	{
		name = SuperLightweight
		displayName = Super Lightweight
		massFraction = 0.047
		costMultiplier = 1.5
	}

	VARIANT
	{
		name = Featherweight
		massFraction = 0.041
		costMultiplier = 1.9
	}
}

OMNI_MASS_FRACTION
{
	name = Size1p5Plus

	// If maxVolume is omitted then it defaults to Infinity

	VARIANT
	{
		name = Standard

		// Stock tanks that are 1.875 m and above use an 11.1% mass fraction.
		massFraction = 0.111
		costMultiplier = 1
		primaryColor = #3a562a
		secondaryColor = #999999
	}

	VARIANT
	{
		name = Lightweight
		massFraction = 0.09
		costMultiplier = 1.3
		primaryColor = #3a562a
		secondaryColor = #999999
	}

	VARIANT
	{
		name = SuperLightweight
		displayName = Super Lightweight
		massFraction = 0.075
		costMultiplier = 1.6
		primaryColor = #3a562a
		secondaryColor = #999999
	}

	VARIANT
	{
		name = Featherweight
		massFraction = 0.065
		costMultiplier = 2
		primaryColor = #3a562a
		secondaryColor = #999999
	}
}