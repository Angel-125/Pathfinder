PART
{
	name = wbiPonderosaV2
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/Pathfinder/Assets/Ponderosa
	}
	rescaleFactor = 1
	node_attach = 0, 0, 0, 0, -1, 0, 3
	node_stack_bottom = 0, 0, 0, 0, -1, 0, 3
	node_stack_front = 0, 0.506, -4.272, 0, 0, -1, 2
	node_stack_left = -1.928, 0.506, -2.344, -1, 0, 0, 2
	node_stack_right = 1.928, 0.506, -2.344, 1, 0, 0, 2
	node_stack_top = 0, 0.8288187, 0, 0, 1, 0, 2

	TechRequired = spaceExploration
	category = Pods
	entryCost = 18000
	cost = 8000
	subcategory = 0
	title = Ponderosa IHM
	manufacturer = Wild Blue Industries
	description = The Ponderosa Inflatable Habitat Module (IHM) is a containerized habitat that can be configured for a wide variety of different purposes.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 0.06
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 15
	maxTemp = 1000
	skinMaxTemp = 2000
	emissiveConstant = 0.5
	breakingForce = 500
	breakingTorque = 500
	bulkheadProfiles = size1, srf
	vesselType = Base
	CrewCapacity = 0
	tags = cck-Pathfinder

	INTERNAL
	{
		name = WBI_PonderosaSpace
	}

	MODULE
	{
		name:NEEDS[WildBlueCore] = WBIModuleAnimateGenericExtended
		name:NEEDS[!WildBlueCore] = ModuleAnimateGeneric

		animationName = Deploy
		startEventGUIName = Assemble
		endEventGUIName = Disassemble
		actionGUIName = Toggle Assembly
		allowAnimationWhileShielded = False

		startEventRequiresResources = True
		endEventGivesResources = True
		canUseRemoteResources = True

		startSoundURL = Squad/Sounds/elev_start
		loopSoundURL = WildBlueIndustries/Pathfinder/FX/mixkit-construction-loop
		loopSoundPitch = 0.6
		loopSoundVolume = 1.0
		stopSoundURL = Squad/Sounds/elev_stop

		CrewCapacity = 4

		// Input resources required to deploy the part.
		INPUT_RESOURCE
		{
			name = Equipment
			amount = 200
			FlowMode = STAGE_PRIORITY_FLOW
		}	
		
		// Output resources returned when undeploying the part.
		OUPUT_RESOURCE
		{
			name = Equipment
			amount = 200
			FlowMode = STAGE_PRIORITY_FLOW
		}	

		// Enabled when the part is deployed, disabled when not deployed.
		MANAGED_MODULES
		{
			moduleName = ModuleCommand
			moduleName = ModuleDataTransmitter
			moduleName = WBILight
			moduleName = WBIEfficiencyMonitor
			moduleName = ModuleKISInventory
			moduleName = WBIPropStateHelper
			moduleName = WBIOmniConverter
			moduleName = WBIOmniStorage
			moduleName = ModuleInventoryPart
			moduleName = SoilRecycler
			moduleName = SnacksConverter
			moduleName = ModuleColorChanger
		}

		// These resources are added when the part is deployed and removed when it's undeployed.		
		MANAGED_RESOURCE
		{
			name = ElectricCharge
			maxAmount = 200
		}
		MANAGED_RESOURCE:NEEDS[SnacksUtils]
		{
			name = Snacks
			maxAmount = 800
		}
		MANAGED_RESOURCE:NEEDS[SnacksUtils]
		{
			name = Soil
			maxAmount = 800
		}
		MANAGED_RESOURCE:NEEDS[SnacksFreshAir]
		{
			name = StaleAir
			maxAmount = 64
		}
		MANAGED_RESOURCE:NEEDS[SnacksFreshAir]
		{
			name = FreshAir
			maxAmount = 400
		}
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.01777778
		}
		hasHibernation = True
		hibernationMultiplier = 0.001
	}

	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = INTERNAL
		packetInterval = 1.0
		packetSize = 2
		packetResourceCost = 12.0
		requiredResource = ElectricCharge
		antennaPower = 5000
		optimumRange = 2500
		packetFloor = .1
		packetCeiling = 5
	}

	MODULE:NEEDS[KIS]
	{
		name = ModuleKISItemEvaTweaker
		editorItemsCategory = false
		carriable = true
		equipMode = part
		equipSlot = jetpack
		equipBoneName = aliasJetpack
		equipPos = 0,-0.2,-0.45
		equipDir = 0,0,0
		runSpeed = 0.8
	}

	MODULE:NEEDS[KIS]
	{
		name = ModuleKISInventory
		invType = Pod
		podSeat = 0
	}
	MODULE:NEEDS[KIS]
	{
		name = ModuleKISInventory
		invType = Pod
		podSeat = 1
	}
	MODULE:NEEDS[KIS]
	{
		name = ModuleKISInventory
		invType = Pod
		podSeat = 2
	}
	MODULE:NEEDS[KIS]
	{
		name = ModuleKISInventory
		invType = Pod
		podSeat = 3
	}

	MODULE
	{
		name = ModuleInventoryPart		
		InventorySlots = 6
		packedVolumeLimit = 400
	}

	MODULE
	{
		name = ModuleGroundPart
		packedVolume = 1100
	}

	MODULE
	{
		name = ModuleColorChanger
		shaderProperty = _EmissiveColor
		animRate = 0.8
		animState = false
		useRate = true
		toggleInEditor = true
		toggleInFlight = true
		toggleInFlight = true
		unfocusedRange = 5
		toggleName = #autoLOC_502011 //#autoLOC_502011 = Toggle Lights
		eventOnName = #autoLOC_502012 //#autoLOC_502012 = Lights On
		eventOffName = #autoLOC_502013 //#autoLOC_502013 = Lights Off
		toggleAction = True
		defaultActionGroup = Light
		useMaterialsList = true
		materialsNames = Window
		redCurve
		{
			key = 0 0 0 3
			key = 1 1 0 0
		}
		greenCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
		blueCurve
		{
			key = 0 0 0 0
			key = 1 0.7 1.5 0
		}
		alphaCurve
		{
			key = 0 1
		}
	}

	MODULE
	{
		name = WBIEfficiencyMonitor
		efficiencyType = habitation
		harvestType = 0
	}

	MODULE
	{
		name = FlagDecal
		textureQuadName = flagTransform
	}

	MODULE:NEEDS[KIS]
	{
		name = ModuleKISInventory
		maxVolume = 200
		externalAccess = true
		internalAccess = true
		slotsX = 5
		slotsY = 5
		slotSize = 50
		itemIconResolution = 128
		selfIconResolution = 128
		openSndPath = KIS/Sounds/containerOpen
		closeSndPath = KIS/Sounds/containerClose
		defaultMoveSndPath = KIS/Sounds/itemMove
	}

	MODULE
	{
		name = WBIPropStateHelper
	}

	MODULE
	{
		name = WBIOmniConverter

		//Name of the button displayed in the OpsManager
		managedName = OmniConverter 1

		//Name of the templates that the omni converter can use
		templateNodes = OMNICONVERTER

		//Tags to further refine the allowed converters
		templateTags = hab

		//Base efficiency based on a 1000-liter converter volume.
		//Smaller converters have lower efficiency while bigger converters have larger efficiencies.
		//Example: a 500-liter converter has a BaseEfficiency of 0.5
		BaseEfficiency = 1.0

		//Reconfigure skill
		reconfigureSkill = ConverterSkill

		//Resource required to configure the converter
		requiredResource = Equipment

		//Amount of the required resource needed to reconfigure the converter
		requiredAmount = 150

		//Standard ModuleResourceConverter stuff
		ConverterName = OmniConverter 1
		StartActionName = Start Converter 1
		StopActionName = Stop Converter 1
		AutoShutdown = false
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.04
		SpecialistBonusBase = 0.96
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		showOpsView = true
	}

	MODULE
	{
		name = WBIOmniConverter
		managedName = OmniConverter 2
		templateNodes = OMNICONVERTER
		templateTags = hab
		BaseEfficiency = 1.0
		reconfigureSkill = ConverterSkill
		requiredResource = Equipment
		requiredAmount = 150
		ConverterName = OmniConverter 2
		StartActionName = Start Converter 2
		StopActionName = Stop Converter 2
		AutoShutdown = false
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.04
		SpecialistBonusBase = 0.96
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		showOpsView = true
	}

	MODULE
	{
		name = WBIOmniStorage

		//In liters, how much can the part store.
		storageVolume = 400

		//Adjust storage volume to account for resource switcher's capacity factor.
		accountForSwitcherCapacity = true

		//Skill required to reconfigure the container.
		reconfigureSkill = ConverterSkill

		//Minimum rank to reconfigure the container.
		reconfigureRank = 1

		//Resource required to reconfigure the container.
		requiredResource = Equipment

		//Amount of the required resource to reconfigure the container.
		requiredAmount = 0
	}

	MODULE
	{
		name = WBIMeshToggle
		guiVisible = false
		meshesVisible = false
		objects = logoPanel001;logoPanel002;logoPanel003;logoPanel004
	}
}

@PART[KIS_ContainerMount1]:NEEDS[KIS]
{
	@MODULE[ModuleKISPartMount]
	{
		@MOUNT
		{
			allowedPartName = wbiPonderosaV2
		}
	}
}

@PART[WBI_Ponderosa]:NEEDS[Impact]
{

	MODULE
	{
		name = Seismometer
	}
}
