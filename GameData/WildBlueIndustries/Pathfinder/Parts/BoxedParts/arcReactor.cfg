PART
{
	name = wbiArcReactor
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/Pathfinder/Parts/BoxedParts/arcReactor
	}
	rescaleFactor = 1

	node_attach = 0, 0, 0, 0, -1, 0, 1
	node_stack_bottom = 0, 0, 0, 0, -1, 0, 1
	node_stack_top = 0, 0.8288187, 0, 0, 1, 0, 1

	NODE
	{
		transform = node001
		name = node1
		size = 2
		method = FIXED_JOINT
		rigid = true
	}

	NODE
	{
		transform = node002
		name = node2
		size = 2
		method = FIXED_JOINT
		rigid = true
	}

	NODE
	{
		transform = node003
		name = node3
		size = 2
		method = FIXED_JOINT
		rigid = true
	}

	NODE
	{
		transform = node004
		name = node4
		size = 2
		method = FIXED_JOINT
		rigid = true
	}

	TechRequired = specializedElectrics
	entryCost = 50000
	cost = 4000
	category = Utility
	subcategory = 0
	title = A.R.C. Fusion Reactor
	manufacturer = Wild Blue Industries
	description = The Affordable Robust Compact fusion reactor generates an enormous amount of electricity for your base's power needs. It generates much more than the Solar Flare version of the Hacienda due to being a permanent installation.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 0.06
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 70
	maxTemp = 900
	breakingForce = 500000
	breakingTorque = 500000
	bulkheadProfiles = size1, srf
	vesselType = Base
	CrewCapacity = 0
	tags = cck-Pathfinder

	MODULE:NEEDS[KIS]
	{
		name = ModuleKISItemEvaTweaker
		volumeOverride = 1100
		editorItemsCategory = false
		carriable = true
		equipMode = part
		equipSlot = jetpack
		equipBoneName = aliasJetpack
		equipPos = 0,-0.2,-0.45
		equipDir = 0,0,0
		runSpeed = 0.8
		allowPartAttach = 1
	}

	MODULE
	{
		name = WBIOmniConverter
		ConverterName = Fusion Reactor
		StartActionName = Start Reactor
		StopActionName = Stop Reactor
		FillAmount = 1.0
		 
		AutoShutdown = true
		GeneratesHeat = false
		UseSpecializationBonus = true
		SpecialistHeatFactor = 0.2
		SpecialistEfficiencyFactor = 0.1
		Specialty = Engineer
		EfficiencyBonus = 1.0
		 
		INPUT_RESOURCE
		{
			ResourceName = FusionPellets
			Ratio = 0.00315
			FlowMode = ALL_VESSEL
		}

		OUTPUT_RESOURCE
		{
			ResourceName = wbiElectroPlasma
			Ratio = 3000
			DumpExcess = true
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 3000
			DumpExcess = true
		}

		REQUIRED_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 1500
		}
	}
	MODULE
	{
		name = WBIOmniConverter
		ConverterName = EPS Transformer
		StartActionName = Start EPS Transformer
		StopActionName = Stop EPS Transformer
		FillAmount = 1.0
		 
		AutoShutdown = true
		GeneratesHeat = false
		 
		INPUT_RESOURCE
		{
			ResourceName = wbiElectroPlasma
			Ratio = 10
			FlowMode = ALL_VESSEL
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 60
		}

		REQUIRED_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 60
		}
	}
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.02777778
		}
		hasHibernation = True
		hibernationMultiplier = 0.004
	}

	MODULE:NEEDS[WildBlueCore]
	{
		name = WBIModuleFuelPump
	}

	MODULE
	{
		name = WBIManagedAnimation

		animationName = Deploy
		startEventGUIName = Assemble
		endEventGUIName = Collapse (EDITOR ONLY)
		actionGUIName = Toggle Assembly
		allowAnimationWhileShielded = False
		isOneShot = true

		startEventRequiresResources = True
		endEventGivesResources = True
		canUseRemoteResources = True

		deployedMass = 4.4

		//List of part modules that should be enabled/disabled depending upon whether or not the part is deployed.
		MANAGED_MODULES
		{
			moduleName = WBIOmniConverter
			moduleName = WBIResourceDistributor
			moduleName = WBIModuleFuelPump
		}

		//List of resources needed to unpack the part.
		INPUT_RESOURCE
		{
			ResourceName = Konkrete
			Ratio = 750
		}

		INPUT_RESOURCE
		{
			ResourceName = Equipment
			Ratio = 1040
		}

		// These resources are added when the part is deployed and removed when it's undeployed.		
		MANAGED_RESOURCE
		{
			name = ElectricCharge
			maxAmount = 3000
		}
		MANAGED_RESOURCE:NEEDS[ClassicStock]
		{
			name = wbiElectroPlasma
			maxAmount = 1500
		}
		MANAGED_RESOURCE
		{
			name = FusionPellets
			maxAmount = 1000
		}
	}

	//EL Recipe needed to build the part.
	EL_Recipe
	{
		structure = 1
		Resources
		{
			Konkrete = 0.75
			RocketParts = 0.25
		}
	}

	MODULE
	{
		name = ModuleGroundPart
		packedVolume = 1100
	}
}

@PART[KIS_ContainerMount1]:NEEDS[KIS]
{
	@MODULE[ModuleKISPartMount]
	{
		@MOUNT
		{
			allowedPartName = wbiArcReactor
		}
	}
}
