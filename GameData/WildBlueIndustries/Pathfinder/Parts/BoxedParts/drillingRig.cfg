PART
{
	name = wbiDrillingRig
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/Pathfinder/Parts/BoxedParts/drillRig
	}
	rescaleFactor = 1

	node_attach = 0, 0, 0, 0, -1, 0, 1
	node_stack_bottom = 0, 0, 0, 0, -1, 0, 1
	node_stack_top = 0, 0.8288187, 0, 0, 1, 0, 1

	NODE
	{
		transform = node001
		name = node1
		size = 2
		method = FIXED_JOINT
		rigid = true
	}

	NODE
	{
		transform = node002
		name = node2
		size = 2
		method = FIXED_JOINT
		rigid = true
	}

	NODE
	{
		transform = node003
		name = node3
		size = 2
		method = FIXED_JOINT
		rigid = true
	}

	TechRequired = specializedConstruction
	entryCost = 50000
	cost = 8000
	category = Utility
	subcategory = 0
	title = Drilling Rig
	manufacturer = Wild Blue Industries
	description = What this drilling rig lacks in portability, it makes up for in its ability to extract resources from the ground. It has a small amount of underground storage to assist with resource distribution.
	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 0.06
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 70
	maxTemp = 900
	breakingForce = 500000
	breakingTorque = 500000
	bulkheadProfiles = size1, srf
	vesselType = Base
	CrewCapacity = 0
	tags = cck-Pathfinder

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.02777778
		}
		hasHibernation = True
		hibernationMultiplier = 0.004
	}
//	MODULE
//	{
//		name = WBIAnimation
//		animationName = DrillAnim
//		startEventGUIName = Activate
//		endEventGUIName = Deactivate
//		playAnimationLooped = true
//		guiIsVisible = false
//	}

	MODULE
	{
		name = WBIGoldStrikeDrill
		HarvesterType = 0
		Efficiency = 16
		ResourceName = Ore
		ConverterName = Ore
		StartActionName = Start Strip Mining
		StopActionName = Stop Strip Mining
		drillAnimationName = DrillAnim
		ImpactTransform = ImpactTransform
		ImpactRange = 15
		AutoShutdown = true
		UseSpecialistBonus = false
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		ExperienceEffect = DrillSkill
		EfficiencyBonus = 6
		GeneratesHeat = false

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 15
		}
	}
	MODULE
	{
		name = ModuleAnimationGroup
		deployAnimationName =
		activeAnimationName = DrillAnim
		deployActionName = #autoLOC_6002390 //#autoLOC_6002390 = Deploy <<1>>
		retractActionName = #autoLOC_6002391 //#autoLOC_6002391 = Retract <<1>>
		toggleActionName = #autoLOC_6002392 //#autoLOC_6002392 = Toggle <<1>>
		moduleType = #autoLOC_7001228 //#autoLOC_7001228 = Drill		
	}
	MODULE:NEEDS[KIS]
	{
		name = ModuleKISItemEvaTweaker
		volumeOverride = 1100
		editorItemsCategory = false
		carriable = true
		equipMode = part
		equipSlot = jetpack
		equipBoneName = aliasJetpack
		equipPos = 0,-0.2,-0.45
		equipDir = 0,0,0
		runSpeed = 0.8
		allowPartAttach = 1
	}

	MODULE:NEEDS[WildBlueCore]
	{
		name = WBIModuleFuelPump
	}

	MODULE
	{
		name = WBIOmniStorage

		storageVolume = 3000

		//Adjust storage volume to account for resource switcher's capacity factor.
		accountForSwitcherCapacity = true

		//Skill required to reconfigure the container.
		reconfigureSkill = ConverterSkill

		//Minimum rank to reconfigure the container.
		reconfigureRank = 1

		//Resource required to reconfigure the container.
		requiredResource = Equipment

		//Amount of the required resource to reconfigure the container.
		requiredAmount = 0
	}
	MODULE:NEEDS[WildBlueCore]
	{
		name = WBIModuleFuelPump
	}
	MODULE
	{
		name = WBIManagedAnimation

		animationName = Deploy
		startEventGUIName = Assemble
		endEventGUIName = Collapse (EDITOR ONLY)
		actionGUIName = Toggle Assembly
		allowAnimationWhileShielded = False
		isOneShot = true

		startEventRequiresResources = True
		endEventGivesResources = False
		canUseRemoteResources = True

		deployedMass = 5.65

		//List of part modules that should be enabled/disabled depending upon whether or not the part is deployed.
		MANAGED_MODULES
		{
			moduleName = WBIResourceDistributor
			moduleName = WBIGoldStrikeDrill
			moduleName = ModuleAnimationGroup
			moduleName = WBIOmniStorage
			moduleName = WBIModuleFuelPump
			moduleName = ModuleAnimationGroup
		}

		//List of resources needed to unpack the part.
		INPUT_RESOURCE
		{
			ResourceName = Konkrete
			Ratio = 750
		}

		INPUT_RESOURCE
		{
			ResourceName = Equipment
			Ratio = 1540
		}

		// These resources are added when the part is deployed and removed when it's undeployed.		
		MANAGED_RESOURCE
		{
			name = ElectricCharge
			maxAmount = 5000
		}
	}

	//EL Recipe needed to build the part.
	EL_Recipe
	{
		structure = 1
		Resources
		{
			Konkrete = 0.75
			RocketParts = 0.25
		}
	}

	MODULE
	{
		name = ModuleCargoPart		
		packedVolume = 1100
	}
}

@PART[KIS_ContainerMount1]:NEEDS[KIS]
{
	@MODULE[ModuleKISPartMount]
	{
		@MOUNT
		{
			allowedPartName = wbiDrillingRig
		}
	}
}

PATH_DRILLING
{
	author = Angel-125
	name = DrillingRig
	description = This kit does nothing. Nothing at all.
	enableDrill = true
}
