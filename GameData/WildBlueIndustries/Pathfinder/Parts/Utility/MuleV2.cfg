PART:NEEDS[!WildBlueIndustries/DSEV]
{
	// --- general parameters ---
	name = wbiMuleV2
	module = Part
	author = Michael Billard (Angel-125)

	// --- asset parameters ---
	rescaleFactor = 1

	MODEL
	{
		model = WildBlueIndustries/Pathfinder/Assets/Mule
	}

	// --- node definitions ---
	// definition format is Position X, Position Y, Position Z, Up X, Up Y, Up Z
	node_stack_top = 0.0, 0.9375, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = 0.0, -0.9375, 0.0, 0.0, -1.0, 0.0, 2

	// --- editor parameters ---
	TechRequired = advExploration
	entryCost = 9000
	cost = 1600
	category = Payload
	subcategory = 0
	title = Mule MLM
	manufacturer = Wild Blue Industries
	description = The Mule Multipurpose Logistics Module (MLM) is designed to provide storage for a variety of different materials and supplies. Simply configure it to the desired storage type before launch and optionally load the desired supplies.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 0.6
	dragModelType = default
	maximum_drag = 0.25
	minimum_drag = 0.25
	angularDrag = .5
	crashTolerance = 45
	breakingForce = 280
	breakingTorque = 280
	maxTemp = 1000
	skinMaxTemp = 2000
	emissiveConstant = 0.5
	CrewCapacity = 0
	tags = cck-Pathfinder

	MODULE
	{
		name = ModuleInventoryPart		
		InventorySlots = 15
		packedVolumeLimit = 8000
	}

	MODULE
	{
		name = WBIOmniStorage

		//In liters, how much can the part store.
		storageVolume = 8000

		//Skill required to reconfigure the container.
		reconfigureSkill = ConverterSkill

		//Minimum rank to reconfigure the container.
		reconfigureRank = 1

		//Resource required to reconfigure the container.
		requiredResource = Equipment

		//Amount of the required resource to reconfigure the container.
		requiredAmount = 0
	}

	MODULE:NEEDS[KIS]
	{
	    name = ModuleKISInventory
	    maxVolume = 200
	    externalAccess = true
	    internalAccess = true
	    slotsX = 10
	    slotsY = 8
	    slotSize = 50
	    itemIconResolution = 128
	    selfIconResolution = 128
	    openSndPath = KIS/Sounds/containerOpen
	    closeSndPath = KIS/Sounds/containerClose
	    defaultMoveSndPath = KIS/Sounds/itemMove
	}

	MODULE
	{
		name = WBIMeshToggle
		guiVisible = false
		meshesVisible = false
		objects = logoPanel001;logoPanel002;logoPanel003;logoPanel004
	}
	
	MODULE:NEEDS[SandCastle]
	{
		name = ModuleStorablePart	
		packedVolume = 400
	}
}